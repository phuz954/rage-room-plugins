<!DOCTYPE html><html><head><title>Rage Room</title><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script><style>body{background:#111;color:#fff;font-family:Arial;padding:20px}#chat{height:400px;border:1px solid #333;overflow-y:auto;padding:10px;margin-bottom:10px}input{width:70%;padding:10px;background:#222;color:#fff;border:1px solid #333}button{padding:10px;background:red;color:#fff;border:none;cursor:pointer} small{color:#888}</style></head><body><h1>RAGE ROOM - Roast A Plugin</h1><small>Roast the plugin, not the person. No doxxing, no threats.</small><div id="chat"></div><input id="user" placeholder="your name"/><input id="msg" placeholder="talk shit about a plugin..."/><button onclick="send()">SEND</button><hr><small>Owner only:</small> <input id="admin" placeholder="admin key to clear" type="password"/><button onclick="clearChat()">CLEAR ALL</button><script>const socket=io();const chat=document.getElementById('chat');socket.on('chat_message',d=>{chat.innerHTML+=`<div><b>${d.user}:</b> ${d.message}</div>`;chat.scrollTop=chat.scrollHeight});socket.on('delete_message',d=>{if(d.clear_all) chat.innerHTML='<div><i>Chat cleared by owner</i></div>'});function send(){const user=document.getElementById('user').value||'anon';const message=document.getElementById('msg').value;if(!message)return;socket.emit('chat_message',{user,message});document.getElementById('msg').value=''}function clearChat(){const admin_key=document.getElementById('admin').value;socket.emit('delete_message',{admin_key,clear_all:true})}</script></body></html>
